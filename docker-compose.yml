services:
  postgres:
    image: postgres:16-alpine
    container_name: vetweb-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetweb_study
      POSTGRES_USER: vetweb_study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - vetweb-study-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetweb_study -d vetweb_study"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vetweb-study-postgres-data:
